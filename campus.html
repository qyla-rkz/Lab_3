<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Campus Life</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(to right, #87ebb6, #87c0eb);
      color: #333;
      margin: 0;
      padding: 0;
    }
    header {
      text-align: center;
      padding: 20px;
      background-color: rgba(0, 0, 0, 0.7);
      color: white;
      animation: fadeIn 2s ease-in-out;
    }
     header:hover {
      box-shadow: 0px 0px 25px rgba(255, 0, 0, 0.9);
      transition: 0.4s ease-in-out;
    }
    h1 {
     animation: fadeIn 2s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes headerBackground {
      0% { background: rgba(183, 0, 255, 0.8); }
      50% { background: rgba(0, 145, 255, 0.51); }
      100% { background: rgba(183, 0, 255, 0.8); }
    }
    header {
      animation: headerBackground 8s infinite alternate ease-in-out;
    }
    nav {
      margin-top: 10px;
      text-align: center;
    }
    nav a {
      display: inline-block;
      text-decoration: none;
      color: white;
      background: #ff0000;
      padding: 12px 24px;
      margin: 8px;
      border-radius: 25px;
      transition: 0.3s ease-in-out;
      font-weight: bold;
      box-shadow: 0px 3px 6px rgba(0, 0, 0, 0.2);
    }
    nav a:hover {
      transform: translateY(-5px);
    }
    main {
      width: 100%;
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
      background: #ffffffb0;
      border-radius: 15px;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center; 
    }
    .hobby-item {
      font-size: 1.5em;
      padding: 25px;
      background: rgba(0, 145, 255, 0.1);
      border-radius: 20px;
      box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.2);
      transition: 0.4s ease-in-out;
      width: 90%;
      cursor: pointer;
      margin: 15px auto;
    }
    .hobby-item:hover {
      background: rgba(0, 145, 255, 0.3);
      transform: scale(1.05);
    }
    .hobby-item img {
      display: none;
      opacity: 0;
      transition: opacity 0.5s ease-in-out;
      border-radius: 15px;
      margin: 10px auto;
      box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.2);
      max-width: 100%;
      height: auto;
    }
    .hobby-item:focus-within img {
      display: block;
      opacity: 1;
    }
    footer {
      text-align: center;
      padding: 20px;
      background-color: rgba(0, 0, 0, 0.7);
      color: white;
      margin-top: 40px;
    }
    </style>
</head>
<body>
  <header>
    <h1>📸 My Campus Life 📸</h1>
    <nav>
      <a href="index.html">Home</a>
    </nav>
  </header>
  
  <main id="memories">
    <p>Here are some of my favorite campus moments:</p>
    <div class="hobby-item" tabindex="0">
      🎓 First day at UTHM with classmates
      <img src="meeting.jpg" alt="Meeting_1st_Day">
    </div>
    <div class="hobby-item" tabindex="0">
      🎖️ Joined UTHM co-curiculum marching Competiotion
      <img src="marching.jpg" alt="Marching Competiotion">
    </div>
    <div class="hobby-item" tabindex="0">
      🌸 Celebrated Hari Raya with classmates
      <img src="raya1.jpg" alt="Raya_1">
      <img src="raya2.jpg" alt="Raya_2">
    </div>
    <div class="hobby-item" tabindex="0">
      🏕️ Went on a trip to Sungai Lurus with friends
      <img src="trip.jpg" alt="Trip">
    </div>
  </main>
  
  <footer>
    <p>© 2025 My Campus Life | Created by Aqilah🦔</p>
  </footer>
</body>
</html>
